<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Robot head -->
  <rect x="20" y="15" width="60" height="50" rx="8" fill="url(#robotGradient)"/>
  
  <!-- Robot eyes -->
  <circle cx="35" cy="35" r="5" fill="white"/>
  <circle cx="65" cy="35" r="5" fill="white"/>
  <!-- Robot antenna -->
  <rect x="47" y="5" width="6" height="12" rx="2" fill="url(#robotGradient)"/>
  <circle cx="50" cy="5" r="4" fill="url(#robotGradient)"/>
  <!-- Robot body -->
  <rect x="25" y="65" width="50" height="30" rx="6" fill="url(#robotGradient)"/>
  <!-- Robot buttons -->
  <circle cx="40" cy="78" r="3" fill="white" opacity="0.8"/>
  <circle cx="50" cy="78" r="3" fill="white" opacity="0.8"/>
  <circle cx="60" cy="78" r="3" fill="white" opacity="0.8"/>
</svg>
